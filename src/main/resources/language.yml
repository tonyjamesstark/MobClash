# MobClash Language Configuration
# Use {0}, {1}, etc. for placeholders
# Use & for color codes (e.g., &a = green, &c = red, &e = yellow)

# General Messages
no-permission: "&cYou don't have permission to use this command."
players-only: "&cOnly players can use this command."
invalid-number: "&cInvalid number!"
invalid-amount: "&cAmount must be between 1 and 100."
invalid-name: "&cInvalid name '{0}'! Use letters, numbers, _ and - only (max 32 characters)."
no-location: "&cThis command must be run by a player or from a command block."
unknown-subcommand: "&c'{0}' is not a MobClash command. Try /mobclash help."
reload-success: "&aReloaded config.yml and language.yml."
reload-failed: "&cNot reloaded: {0} has a syntax error. Nothing changed; the console has the details."
egg-unknown-type: "&eIgnoring {0} in the wave chest: no mob matches it on this server version."
egg-not-a-mob: "&eIgnoring {0} in the wave chest: its entity data does not spawn a mob."
egg-has-riders: "&eIgnoring {0} in the wave chest: eggs with riders (Passengers) are not supported."
egg-has-uuid: "&eIgnoring {0} in the wave chest: an egg with a fixed UUID can spawn only one mob."

# Group Messages
group-not-exist: "&cGroup '{0}' doesn't exist!"
group-no-points: "&cGroup '{0}' has no spawn points!"
no-groups: "&cNo spawn groups configured!"

# Add Spawn Command
addspawn-usage: "&cUsage: /addspawn <group>"
addspawn-success: "&aAdded spawn point to group '{0}'! Total points: {1}"

# Remove Spawn Command
removespawn-usage: "&cUsage: /removespawn <group>"
removespawn-success: "&aRemoved nearest spawn point from group '{0}'!"

# List Groups Command
listgroups-header: "&a=== Spawn Groups ==="
listgroups-entry: "&e{0} &7({1} points)"

# List Spawns Command
listspawns-usage: "&cUsage: /listspawns <group>"
listspawns-header: "&a=== Spawn Points for '{0}' ({1} total) ==="
listspawns-entry: "&e#{0} &7{1} &f(&a{2}&f, &a{3}&f, &a{4}&f)"

# Show Spawns Command
showspawns-usage: "&cUsage: /showspawns <group>"
showspawns-success: "&aShowing {1} spawn point(s) for group '{0}'!"

# Set Chest Command
setchest-usage: "&cUsage: /setchest <group> <wave>"
setchest-success: "&aSpawn egg chest '{1}' set for group '{0}'!"
must-look-chest: "&cYou must be looking at a chest!"

# Summon Mobs Command
summonmobs-usage: "&cUsage: /summonmobs <group> <wave> <random|all> [amount] [true|false|<gear chest>]"
summonmobs-success: "&aSpawned {0} mob(s) in group '{1}' wave '{2}'!"
invalid-mode: "&cMode must be 'random' or 'all'!"
wave-not-set: "&cWave '{1}' not set for group '{0}'! Use /setchest {0} {1} first."
chest-missing: "&cThe configured chest no longer exists!"
no-spawn-eggs: "&cNo spawn eggs found in the chest!"
invalid-equipment: "&c'{0}' is not an amount, true or false, or a chest set with /setchest {1} {0}."
summon-too-large: "&cThat would spawn {0} mobs, over the limit of {1}. Lower the amount or raise max-mobs-per-summon."

# Kills Command
kills-usage: "&cUsage: /kills [top [amount] | reset | resetall] &7- plain /kills shows your own"
kills-personal: "&aYou have killed &e{0}&a MobClash mobs!"
kills-none: "&cNo kills recorded yet!"
kills-top-header: "&a=== Top {0} MobClash Killers ==="
kills-top-entry: "&e#{0} &7{1} &f- &a{2} kills"
kills-reset: "&aYour kills have been reset! (was {0})"
kills-resetall: "&aAll player kills have been reset!"

# Kill Board Command
killboard-usage: "&cUsage: /killboard [world <on|off> | alloff] &7- plain /killboard toggles your own"
killboard-title: "&6MobClash Kills"
killboard-on: "&aKill board on."
killboard-off: "&aKill board off."
killboard-world-on: "&aKill board turned on for {0} player(s) in {1}."
killboard-world-off: "&aKill board turned off for {0} player(s) in {1}."
killboard-alloff: "&aKill board turned off for {0} player(s)."

# Sent to the whole server when a player kills a mob listed in announce-kills.
# {0} is the player, {1} the mob's name (its custom name, if it has one).
kill-announcement: "&6&l{0} &ehas slain the &c&l{1}&e!"

# /mobclash help, one line per command, shown only if the player may run it
help-header: "&6MobClash commands you can use:"
help-addspawn: "&e/mobclash addspawn <group> &7- add your position to a group"
help-removespawn: "&e/mobclash removespawn <group> &7- remove the group's point nearest you"
help-listgroups: "&e/mobclash listgroups &7- list groups and their point counts"
help-listspawns: "&e/mobclash listspawns <group> &7- list a group's point coordinates"
help-showspawns: "&e/mobclash showspawns <group> &7- flash a marker at each point"
help-setchest: "&e/mobclash setchest <group> <wave> &7- use the chest you look at for a wave or gear"
help-summonmobs: "&e/mobclash summonmobs <group> <wave> <random|all> [amount] [true|false|<gear chest>] &7- summon a wave"
help-kills: "&e/mobclash kills [top [amount]|reset|resetall] &7- your kills, the leaderboard, or a reset"
help-killboard: "&e/mobclash killboard [world <on|off>|alloff] &7- the kill leaderboard in your sidebar"
help-reload: "&e/mobclash reload &7- re-read config.yml and language.yml"
