name: MobClash
version: ${project.version}
main: io.tjs.mobclash.MobClashPlugin
api-version: 1.20
author: tjs
description: Advanced mob spawning system with configurable spawn groups

commands:
  addspawn:
    description: Add a spawn point to a group, at your position
    usage: /<command> <group>

  removespawn:
    description: Remove the spawn point nearest you from a group
    usage: /<command> <group>

  listgroups:
    description: List every spawn group and how many points it has
    usage: /<command>

  listspawns:
    description: List the coordinates of every spawn point in a group
    usage: /<command> <group>

  showspawns:
    description: Flash a particle marker at each of a group's spawn points
    usage: /<command> <group>

  setchest:
    description: Set a wave's spawn egg chest to the chest you are looking at
    usage: /<command> <group> <wave>

  summonmobs:
    description: Summon a wave's mobs at one spawn point or at all of them
    usage: |-
      /<command> <group> <wave> random [amount] - at one random spawn point
      /<command> <group> <wave> all [amount] - at every spawn point
      amount is 1-100 per point, default 1, and the total is capped by max-mobs-per-summon

  kills:
    description: Show your MobClash kills, the leaderboard, or reset them
    usage: |-
      /<command> - your own kill count
      /<command> top [amount] - leaderboard, default 10, maximum 50
      /<command> reset - clear your own kills
      /<command> resetall - clear every player's kills

permissions:
  mobclash.*:
    description: Grants all MobClash permissions
    default: op
    children:
      mobclash.addspawn: true
      mobclash.removespawn: true
      mobclash.listgroups: true
      mobclash.listspawns: true
      mobclash.showspawns: true
      mobclash.setchest: true
      mobclash.summon: true
      mobclash.kills: true
      mobclash.kills.resetall: true

  mobclash.addspawn:
    description: Allows adding spawn points
    default: op

  mobclash.removespawn:
    description: Allows removing spawn points
    default: op

  mobclash.listgroups:
    description: Allows listing spawn groups
    default: op

  mobclash.listspawns:
    description: Allows listing spawn point coordinates
    default: op

  mobclash.showspawns:
    description: Allows showing spawn points visually
    default: op

  mobclash.setchest:
    description: Allows setting spawn egg chests
    default: op

  mobclash.summon:
    description: Allows summoning mobs
    default: op

  mobclash.kills:
    description: Allows viewing kill statistics
    default: true

  mobclash.kills.resetall:
    description: Allows resetting all player kills
    default: op

  # Deprecated mobspawner.* namespace, from before the plugin was renamed. Kept as parents
  # of the new nodes so an existing grant still works; default false so they only take
  # effect where a permissions plugin grants them explicitly.
  mobspawner.*:
    description: Deprecated alias for mobclash.*
    default: false
    children:
      mobclash.*: true

  mobspawner.addspawn:
    description: Deprecated alias for mobclash.addspawn
    default: false
    children:
      mobclash.addspawn: true

  mobspawner.removespawn:
    description: Deprecated alias for mobclash.removespawn
    default: false
    children:
      mobclash.removespawn: true

  mobspawner.listgroups:
    description: Deprecated alias for mobclash.listgroups
    default: false
    children:
      mobclash.listgroups: true

  mobspawner.listspawns:
    description: Deprecated alias for mobclash.listspawns
    default: false
    children:
      mobclash.listspawns: true

  mobspawner.showspawns:
    description: Deprecated alias for mobclash.showspawns
    default: false
    children:
      mobclash.showspawns: true

  mobspawner.setchest:
    description: Deprecated alias for mobclash.setchest
    default: false
    children:
      mobclash.setchest: true

  mobspawner.summon:
    description: Deprecated alias for mobclash.summon
    default: false
    children:
      mobclash.summon: true

  mobspawner.kills:
    description: Deprecated alias for mobclash.kills
    default: false
    children:
      mobclash.kills: true

  mobspawner.kills.resetall:
    description: Deprecated alias for mobclash.kills.resetall
    default: false
    children:
      mobclash.kills.resetall: true
